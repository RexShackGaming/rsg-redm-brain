<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <title>Feather Toolkit</title>
    </head>
    <body>
        <main id="progress" class="progress hidden" aria-live="polite">
            <div class="progress-track">
                <div class="progress-fill"></div>
                <div class="progress-ring"><span id="progress-seconds"
                        class="progress-seconds"></span></div>
                <div id="progress-message" class="progress-label"></div>
            </div>
        </main>
        <script src="app.js"></script>
    </body>
</html>

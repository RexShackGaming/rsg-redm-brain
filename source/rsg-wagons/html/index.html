<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>rsg-wagons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app" class="hidden">

  <!-- ============ LEFT: CATALOGUE ============ -->
  <section id="catalogue" class="panel">
    <header class="panel-header">
      <span class="badge-icon"><i class="fa-solid fa-horse-head"></i></span>
      <div class="header-text">
        <h1 id="storeLabel">Wagon Yard</h1>
        <p class="subtitle" data-i18n="ui_subtitle">Wagons &amp; Coaches</p>
      </div>
      <button id="closeBtn" class="seal-btn" data-i18n-title="ui_close" title="Close">&#10005;</button>
    </header>
    <div class="panel-divider"><span>&#10022;</span></div>

    <nav class="tabs">
      <button class="tab active" data-tab="shop"><i class="fa-solid fa-store"></i> <span data-i18n="ui_for_sale">For Sale</span></button>
      <button class="tab" data-tab="owned"><i class="fa-solid fa-key"></i> <span data-i18n="ui_my_wagons">My Wagons</span> <em id="ownedCount" class="pill">0/5</em></button>
    </nav>

    <div id="shopTools">
      <div id="categoryChips" class="chips"></div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="ui_search" placeholder="Search" />
      </div>
    </div>

    <div id="list" class="list"></div>
  </section>

  <!-- ============ RIGHT: DETAILS ============ -->
  <section id="details" class="panel details hidden">
    <div class="details-head">
      <button id="backBtn" class="back-btn"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="ui_back">Back</span></button>
      <span id="dClass" class="pill">Class</span>
      <h2 id="dName">Wagon</h2>
      <p id="dSub" class="italic"></p>
    </div>
    <div class="cam-row">
      <button class="chevron-btn" data-rotate="left" data-i18n-title="ui_rotate" title="Rotate">&#10094;</button>
      <button class="chevron-btn" data-zoom="1" data-i18n-title="ui_zoom" title="Zoom"><i class="fa-solid fa-minus"></i></button>
      <span class="cam-row-label"><i class="fa-solid fa-camera"></i></span>
      <button class="chevron-btn" data-zoom="-1" data-i18n-title="ui_zoom" title="Zoom"><i class="fa-solid fa-plus"></i></button>
      <button class="chevron-btn" data-rotate="right" data-i18n-title="ui_rotate" title="Rotate">&#10095;</button>
    </div>
    <p class="cam-hint center" data-i18n="ui_controls_hint">A / D rotate &bull; scroll zoom &bull; ESC close</p>
    <div class="ink-divider"></div>
    <p id="dDesc" class="italic desc"></p>

    <div class="stats">
      <div class="stat"><label><span data-i18n="ui_capacity">Capacity</span><b id="sWeightVal"></b></label><div class="track"><div id="sWeight" class="fill stat-good"></div></div></div>
      <div class="stat"><label><span data-i18n="ui_slots">Slots</span><b id="sSlotsVal"></b></label><div class="track"><div id="sSlots" class="fill stat-good"></div></div></div>
      <div class="stat"><label><span data-i18n="ui_seats">Seats</span><b id="sSeatsVal"></b></label><div class="track"><div id="sSeats" class="fill stat-good"></div></div></div>
      <div id="condStat" class="stat hidden"><label><span data-i18n="ui_condition">Condition</span><b id="sCondVal"></b></label><div class="track"><div id="sCond" class="fill stat-good"></div></div></div>
    </div>

    <div id="paintBox" class="livery">
      <small data-i18n="ui_livery">Livery</small>
      <div class="livery-picker">
        <button id="livPrev" class="chevron-btn">&#10094;</button>
        <div class="livery-name"><span id="livName"></span><span id="livCount" class="livery-count"></span></div>
        <button id="livNext" class="chevron-btn">&#10095;</button>
      </div>
      <small data-i18n="ui_colour" class="tint-label">Colour</small>
      <div id="tintPicker" class="livery-picker">
        <button id="tintPrev" class="chevron-btn">&#10094;</button>
        <div class="livery-name"><span id="tintName"></span><span id="tintCount" class="livery-count"></span></div>
        <button id="tintNext" class="chevron-btn">&#10095;</button>
      </div>
    </div>

    <div class="panel-divider"><span>&#10022;</span></div>

    <div id="buyBox" class="price-row">
      <div><small data-i18n="ui_price">Price</small><div id="dPrice" class="price">$0</div></div>
      <button id="buyBtn" class="wood-btn big"><i class="fa-solid fa-coins"></i> <span data-i18n="ui_buy">Purchase</span></button>
    </div>

    <div id="ownedBox" class="owned-actions hidden">
      <div class="trade"><small data-i18n="ui_trade_in">Trade-in value</small><div id="dSell" class="price">$0</div></div>
      <button id="repairBtn" class="wood-btn repair-btn hidden"><i class="fa-solid fa-hammer"></i> <span id="repairText"></span></button>
      <div class="btn-grid">
        <button id="takeOutBtn" class="wood-btn"><i class="fa-solid fa-road"></i> <span data-i18n="ui_take_out">Take Out</span></button>
        <button id="storeBtn" class="wood-btn"><i class="fa-solid fa-warehouse"></i> <span data-i18n="ui_return_wagon">Return Wagon</span></button>
        <button id="renameBtn" class="wood-btn wood-btn-muted"><i class="fa-solid fa-pen-nib"></i> <span data-i18n="ui_rename">Rename</span></button>
        <button id="sellBtn" class="wood-btn wood-btn-muted"><i class="fa-solid fa-hand-holding-dollar"></i> <span data-i18n="ui_sell">Sell</span></button>
      </div>
    </div>
  </section>

  <!-- ============ MODALS ============ -->
  <div id="inputModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="inputTitle" data-i18n="ui_name_wagon">Name your wagon</h2>
      <div class="ink-divider"></div>
      <input id="inputField" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="ui_name_placeholder" />
      <div class="modal-actions">
        <button id="inputCancel" class="wood-btn wood-btn-muted" data-i18n="ui_cancel">Cancel</button>
        <button id="inputOk" class="wood-btn" data-i18n="ui_confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card">
      <h2 data-i18n="ui_sell">Sell</h2>
      <div class="ink-divider"></div>
      <p id="confirmText" class="italic center"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="wood-btn wood-btn-muted" data-i18n="ui_cancel">Cancel</button>
        <button id="confirmOk" class="wood-btn" data-i18n="ui_confirm">Confirm</button>
      </div>
    </div>
  </div>
</div>
<!-- ============ CUSTOMISE (cargo / lanterns) ============ -->
<section id="custom" class="panel custom hidden">
  <header class="panel-header">
    <span class="badge-icon"><i class="fa-solid fa-boxes-stacked"></i></span>
    <div class="header-text">
      <h1 data-i18n="ui_customise">Customise</h1>
      <div id="customName" class="subtitle"></div>
    </div>
  </header>
  <div class="panel-divider"><span>&#10022;</span></div>
  <div id="cargoBox" class="livery">
    <small data-i18n="ui_cargo">Cargo</small>
    <div class="livery-picker">
      <button id="cargoPrev" class="chevron-btn">&#10094;</button>
      <div class="livery-name"><span id="cargoName"></span><span id="cargoCount" class="livery-count"></span></div>
      <button id="cargoNext" class="chevron-btn">&#10095;</button>
    </div>
  </div>
  <div id="lanternBox" class="livery">
    <small data-i18n="ui_lanterns">Lanterns</small>
    <div class="livery-picker">
      <button id="lanternPrev" class="chevron-btn">&#10094;</button>
      <div class="livery-name"><span id="lanternName"></span><span id="lanternCount" class="livery-count"></span></div>
      <button id="lanternNext" class="chevron-btn">&#10095;</button>
    </div>
  </div>
  <div class="modal-actions">
    <button id="customCancel" class="wood-btn wood-btn-muted" data-i18n="ui_cancel">Cancel</button>
    <button id="customSave" class="wood-btn" data-i18n="ui_save">Save</button>
  </div>
</section>

<script src="app.js"></script>
<script src="drag.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud" class="hidden">
  <div class="panel">
    <div class="title" id="title">Place Object</div>
    <div class="subtitle" id="mode">Free</div>
    <div class="divider"><span>✦</span></div>
    <div class="status" id="status"></div>
    <div class="readout">
      <div><span class="lbl" id="lblCoords">Position</span><span class="val" id="coords">0, 0, 0</span></div>
      <div><span class="lbl" id="lblRot">Rotation</span><span class="val" id="rot">0, 0, 0</span></div>
    </div>
    <div class="divider"><span>✦</span></div>
    <div class="keys" id="keys"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>rsg-treasure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root { --rdr-black:#000; --rdr-panel:#0a0a0a; --rdr-panel-2:#141414; --rdr-gold-dim:#5a5a5a; --rdr-text:#f2f2f2; --rdr-muted:#9a9a9a; --rdr-shadow:rgba(0,0,0,0.85); }
html, body { background:transparent; margin:0; width:100%; height:100%; overflow:hidden; user-select:none; font-family:'Roboto',sans-serif; }
#signal {
    position:fixed; top:24px; left:24px; min-width:180px; padding:10px 16px;
    border:1px solid var(--rdr-gold-dim); border-radius:3px; outline:1px solid rgba(0,0,0,0.6); outline-offset:-5px;
    background:linear-gradient(160deg, var(--rdr-panel-2), var(--rdr-panel) 60%, var(--rdr-black));
    box-shadow:0 20px 60px var(--rdr-shadow), inset 0 0 40px rgba(0,0,0,0.5);
    color:var(--rdr-text); transition:opacity 0.25s ease, transform 0.25s ease;
}
#signal.hidden { opacity:0; transform:translateX(-20px); }
#signal .label { font-size:11px; text-transform:uppercase; letter-spacing:3px; color:var(--rdr-muted); }
#signal .value { font-size:16px; font-weight:500; letter-spacing:1px; margin-top:4px; text-shadow:0 1px 2px #000; }
</style>
</head>
<body>
<div id="signal" class="hidden"><div class="label" id="signal-title"></div><div class="value" id="signal-text"></div></div>
<script>
// Signal meter (top-left) + bleep audio: builds a short WAV bleep in memory and plays it with an
// <audio> element. (Web Audio's AudioContext can stay "suspended" in RedM's NUI
// because there is never a user click, which made the old version silent.)
const RATE = 22050;
const cache = {};

function makeWav(pitch, length) {
    const n = Math.max(1, Math.floor(RATE * length));
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    const attack = Math.floor(RATE * 0.005);
    for (let i = 0; i < n; i++) {
        const square = Math.sin(2 * Math.PI * pitch * i / RATE) >= 0 ? 1 : -1;
        const env = Math.min(1, i / attack) * (1 - i / n);   // quick fade in, linear fade out
        v.setInt16(44 + i * 2, square * env * 0.8 * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function beep(volume, pitch, length) {
    const key = Math.round(pitch / 25) * 25 + ':' + length;   // reuse similar pitches
    if (!cache[key]) cache[key] = makeWav(Math.round(pitch / 25) * 25, length);
    const a = new Audio(cache[key]);
    a.volume = Math.min(1, Math.max(0, volume));
    a.play().catch(err => console.log('[rsg-treasure] bleep blocked: ' + err));
}

window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d) return;
    if (d.action === 'beep') beep(d.volume, d.pitch, d.length);
    else if (d.action === 'signal') {
        const el = document.getElementById('signal');
        if (d.show) {
            document.getElementById('signal-title').textContent = d.title || '';
            document.getElementById('signal-text').textContent = d.text || '';
            el.classList.remove('hidden');
        } else el.classList.add('hidden');
    }
});
</script>
</body>
</html>

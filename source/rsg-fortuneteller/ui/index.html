<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  const cache = {};

  function post(name, body) {
    fetch(`https://${GetParentResourceName()}/${name}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).catch(() => {});
  }

  function getAudio(file) {
    if (!cache[file]) {
      const a = new Audio('sounds/' + file);
      a.preload = 'auto';
      cache[file] = a;
    }
    return cache[file];
  }

  window.addEventListener('message', (e) => {
    const d = e.data;

    if (d.action === 'preload') {
      const a = getAudio(d.file);
      if (a.readyState >= 3) return post('preloaded', { file: d.file, ok: true });
      a.addEventListener('canplaythrough', () => post('preloaded', { file: d.file, ok: true }), { once: true });
      a.addEventListener('error', () => post('preloaded', { file: d.file, ok: false }), { once: true });
      a.load();

    } else if (d.action === 'play') {
      const a = getAudio(d.file);
      a.currentTime = 0;
      a.volume = Math.min(1, Math.max(0, d.volume));
      a.play().catch(() => {});

    } else if (d.action === 'stop') {
      Object.values(cache).forEach((a) => { a.pause(); a.currentTime = 0; });
    }
  });
</script>
</body>
</html>

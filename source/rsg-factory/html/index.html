<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rsg-factory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="panel" id="panel">
            <div class="header">
                <div class="titles">
                    <div class="title" id="title"></div>
                    <div class="subtitle" id="subtitle"></div>
                </div>
                <button class="circle-btn" id="closeBtn" title="Close">✕</button>
            </div>
            <div class="view" id="view"></div>
        </div>
        <div class="modal-wrap hidden" id="modal">
            <div class="modal">
                <div class="modal-title" id="modalTitle"></div>
                <div class="ink-divider"></div>
                <div class="modal-text" id="modalText"></div>
                <div class="actions">
                    <button class="wood-btn muted" id="modalCancel"></button>
                    <button class="wood-btn" id="modalOk"></button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

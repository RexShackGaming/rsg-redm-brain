<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rsg-townhall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="panel">
            <header class="head">
                <div class="head-titles">
                    <h1 id="title"></h1>
                    <div id="subtitle" class="subtitle"></div>
                </div>
                <button id="btn-close" class="round-btn" type="button" aria-label="close">✕</button>
            </header>

            <nav class="tabs" id="tabs"></nav>
            <div class="divider"><span>✦</span></div>

            <main class="body" id="body"></main>

            <div id="overlay" class="overlay hidden">
                <div id="modal" class="modal"></div>
            </div>
        </div>
        <div id="toasts" class="toasts"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>

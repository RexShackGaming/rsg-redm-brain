<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Reputation</title>
</head>
<body>
    <div id="root" class="hidden">
        <div class="panel">
            <div class="header">
                <div class="header-side"></div>
                <div class="header-main">
                    <h1 id="title"></h1>
                    <div id="subtitle" class="subtitle"></div>
                </div>
                <div class="header-side right">
                    <button id="closeBtn" class="round-btn" type="button">&#10005;</button>
                </div>
            </div>

            <div class="divider"><span>&#10022;</span></div>

            <div class="section">
                <div class="section-head">
                    <span id="honorLabel" class="label"></span>
                    <span id="honorValue" class="value"></span>
                </div>
                <div class="tier-name" id="honorTier"></div>
                <div class="bar center">
                    <div class="mid"></div>
                    <div id="honorFill" class="fill"></div>
                </div>
                <div class="bar-ends"><span id="honorMin"></span><span id="honorMax"></span></div>
            </div>

            <div class="divider"><span>&#10022;</span></div>

            <div class="section-head list-head">
                <span id="standingLabel" class="label"></span>
                <button id="filterBtn" class="wood-btn small" type="button"></button>
            </div>
            <div id="list" class="list"></div>
            <div id="empty" class="empty hidden"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

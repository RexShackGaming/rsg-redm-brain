<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Economy</title>
</head>
<body>
    <div id="root" class="hidden">
        <div class="panel">
            <div class="header">
                <div class="header-side"></div>
                <div class="header-main">
                    <h1 id="title"></h1>
                    <div id="subtitle" class="subtitle"></div>
                </div>
                <div class="header-side right">
                    <button id="closeBtn" class="round-btn" type="button">&#10005;</button>
                </div>
            </div>

            <div class="divider"><span>&#10022;</span></div>

            <div class="region-row">
                <span id="regionLabel" class="label"></span>
                <div id="regionDd" class="dd"></div>
            </div>
            <div id="roleLine" class="hint"></div>

            <div class="tabs" id="tabs">
                <button class="wood-btn tab" data-tab="taxes" type="button"></button>
                <button class="wood-btn tab" data-tab="treasury" type="button"></button>
                <button class="wood-btn tab" data-tab="market" type="button"></button>
            </div>

            <div id="content" class="content"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

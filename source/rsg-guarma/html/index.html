<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rsg-guarma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="panel">
            <div class="header">
                <div class="icon-btn ghost"></div>
                <div class="titles">
                    <div class="title" id="title"></div>
                    <div class="subtitle" id="subtitle"></div>
                </div>
                <button class="icon-btn" id="close" aria-label="close">✕</button>
            </div>

            <div class="divider"><span>✦</span></div>

            <div class="route">
                <div class="badge">⚓</div>
                <div class="route-text">
                    <div class="route-label" id="routeLabel"></div>
                    <div class="route-dest" id="routeDest"></div>
                </div>
                <div class="pill" id="owned"></div>
            </div>

            <div class="row">
                <div class="row-text">
                    <div class="row-title" id="qtyLabel"></div>
                    <div class="row-desc" id="priceLabel"></div>
                </div>
                <div class="stepper">
                    <button class="step" id="minus">−</button>
                    <div class="qty" id="qty">1</div>
                    <button class="step" id="plus">+</button>
                </div>
            </div>

            <div class="summary">
                <div class="sum-line"><span id="cashLabel"></span><span id="cash"></span></div>
                <div class="sum-line total"><span id="totalLabel"></span><span id="total"></span></div>
            </div>

            <div class="actions">
                <button class="wood-btn muted" id="cancel"></button>
                <button class="wood-btn" id="buy"></button>
            </div>

            <div class="divider"><span>✦</span></div>

            <button class="travel-btn" id="travel">
                <span class="badge">⛴</span>
                <span class="travel-text">
                    <span class="row-title" id="travelLabel"></span>
                    <span class="row-desc" id="travelDesc"></span>
                </span>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
